<html>
  <head><base href="https://selenite.cc/resources/semag/themehotel/">

<script src="https://selenite.cc/js/all.min.js" async></script>
<link rel="icon" type="image/png" href="https://selenite.cc/favicon.ico">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme Hotel</title>
    <style>html{background-color:#000;}</style>
  </head>
  <body>
    <div id="ruffle" width="100%" height="100%"></div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("themehotel.swf");
      });
    </script>
  </body>
</html>
